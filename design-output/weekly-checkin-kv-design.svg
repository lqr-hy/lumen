    <text x="450" y="152" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="78" font-weight="900" fill="#fff" stroke="#fff" stroke-width="2" filter="url(#titleShadow)">每周必看</text>
