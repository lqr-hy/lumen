<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1700" viewBox="0 0 900 1700">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb12b"/>
      <stop offset="0.22" stop-color="#fff0ba"/>
      <stop offset="1" stop-color="#fff7df"/>
    </linearGradient>
    <linearGradient id="redButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a24"/>
      <stop offset="1" stop-color="#e63816"/>
    </linearGradient>
    <linearGradient id="goldButton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe681"/>
      <stop offset="0.55" stop-color="#ffbf28"/>
      <stop offset="1" stop-color="#ff8a1c"/>
    </linearGradient>
    <linearGradient id="prize" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8cf"/>
      <stop offset="1" stop-color="#ffd14d"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
