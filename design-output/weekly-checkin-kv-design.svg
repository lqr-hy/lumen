    </filter>
    <clipPath id="heroClip">
      <rect x="0" y="0" width="900" height="280"/>
    </clipPath>
  </defs>

  <rect width="900" height="1700" fill="url(#pageBg)"/>
  <rect y="260" width="900" height="1440" fill="url(#dots)"/>

